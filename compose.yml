services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-app
    networks: [default, proxy]
    volumes: [./app:/app]
    # /app is bind-mounted, so anything the container writes there (Vite's
    # dep cache, node_modules) lands on the host owned by whoever the container
    # runs as. Without this the dev server runs as root and leaves files the
    # host user cannot delete - `git worktree remove` then fails on cleanup.
    user: "${DOCKER_USER:-1000:1000}"
    environment:
      VITE_API_URL: http://api:4000
    depends_on: [api]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-app-router.rule=Host(`${APP_SUBDOMAIN:-planner}.local`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-app-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-app-router.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-planner}-app-service.loadbalancer.server.port=5173"

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-api
    networks: [default, proxy]
    volumes: [./api:/app]
    # Same bind-mount reasoning as app. The image already runs as `node`, which
    # happens to be uid 1000; naming it here keeps the two services consistent
    # and lets a host whose uid is not 1000 override both at once.
    user: "${DOCKER_USER:-1000:1000}"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner}@postgres:5432/${POSTGRES_DB:-planner}
      REDIS_URL: redis://:${REDIS_PASSWORD:-planner}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${APP_SUBDOMAIN:-planner}.local}
      # Unset by default: the API logs password reset links to its own console
      # instead of sending mail, so the flow works with no Resend account.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@planner.local}
      # Defaults match the API's own production values; override in .env for a
      # local session that outlives a long debugging session.
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-30}
      SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-12}
    ulimits:
      nofile: 65536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-router.rule=Host(`${APP_SUBDOMAIN:-planner}.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-router.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-router.priority=100"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-planner}-api-service.loadbalancer.server.port=4000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-socketio-router.rule=Host(`${APP_SUBDOMAIN:-planner}.local`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-socketio-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-socketio-router.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-socketio-router.priority=200"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-socketio-router.service=${COMPOSE_PROJECT_NAME:-planner}-api-service"
      # Subdomain access: api.<subdomain>.local serves the whole API
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-host-router.rule=Host(`api.${APP_SUBDOMAIN:-planner}.local`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-host-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-host-router.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-api-host-router.service=${COMPOSE_PROJECT_NAME:-planner}-api-service"

  # Dev-only static server for the Vitest HTML report (/) and the Playwright
  # e2e coverage report (/e2e/), reachable at https://coverage.<subdomain>.local.
  # Reports live in app/coverage-reports/ (outside dist/) so app builds never
  # wipe them. Generate with `npx vitest run --reporter=html` and
  # `npm run test:e2e:coverage` respectively.
  coverage:
    image: nginx:1.31-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-coverage
    networks: [proxy]
    volumes:
      - ./app/coverage-reports:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-coverage-router.rule=Host(`coverage.${APP_SUBDOMAIN:-planner}.local`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-coverage-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-coverage-router.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-planner}-coverage-service.loadbalancer.server.port=80"

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev-only database admin UI, reachable at db.<subdomain>.local. Logs in without a
  # master password (desktop mode) and auto-registers the Planner server.
  pgadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-pgadmin
    image: dpage/pgadmin4:latest
    profiles: [debug]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@planner.example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PREFERRED_URL_SCHEME: '"https"'
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./.docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [default, proxy]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-router.rule=Host(`db.${APP_SUBDOMAIN:-planner}.local`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-router.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-router.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-router.service=${COMPOSE_PROJECT_NAME:-planner}-pgadmin-service"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-router.middlewares=${COMPOSE_PROJECT_NAME:-planner}-pgadmin-proto@docker"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-service.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-planner}-pgadmin-proto.headers.customRequestHeaders.X-Forwarded-Proto=https"

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-planner}-redis
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-planner}
    volumes:
      - ./.docker/redis/redis.conf:/etc/redis/redis.conf:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-planner}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-planner}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  pgadmin:

networks:
  proxy:
    external: true
