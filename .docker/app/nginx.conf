server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # nginx's add_header does not merge with the parent context: a location that
  # sets any add_header discards every header set above it. The security headers
  # are therefore repeated in each location that adds one of its own.
  location /assets/ {
    expires 1y;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "public, immutable";
  }

  # The service worker's filename never changes, unlike everything under
  # /assets/ - it has to keep revalidating quickly (not the 5-minute window
  # below) or a new deploy's PWA update takes as long as the stale worker's
  # cache lifetime to even notice.
  location = /sw.js {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    # index.html references hashed /assets/ filenames, so serving it up to 5
    # minutes stale risks pointing at a build that's been pruned - safe here
    # because the app's own version-check poll (useVersionCheck.ts) already
    # catches a stale deploy independently and prompts a refresh, so this
    # isn't the only thing standing between a user and a broken bundle
    # reference the way it would be without that mechanism.
    add_header Cache-Control "public, max-age=300";
  }
}
