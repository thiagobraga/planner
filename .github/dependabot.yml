version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - 'api'
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/app'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - 'app'
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/.docker/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    labels:
      - 'docker'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/.docker/app'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    labels:
      - 'docker'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    labels:
      - 'docker'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      compose:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 7
    labels:
      - 'github_actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      actions:
        patterns:
          - '*'
