name: 2c. Container scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container-scan:
    name: 2c. Container scan (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: .docker/api/Dockerfile
          - component: app
            dockerfile: .docker/app/Dockerfile
          - component: site
            dockerfile: .docker/site/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: false
          load: true
          tags: planner-${{ matrix.component }}:pr-scan
          build-args: APK_REFRESH=${{ github.run_id }}
          # Read-only: reuses the cache 4.deploy.yml's push build warms for this
          # scope. No cache-to - untrusted PR branches must not write into the
          # cache that 4.deploy.yml reads from.
          cache-from: type=gha,scope=${{ matrix.component }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          scan-ref: 'planner-${{ matrix.component }}:pr-scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true

      # SARIF only reaches the Security tab; list the blocking findings in the log too.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: failure()
        with:
          scan-type: 'image'
          scan-ref: 'planner-${{ matrix.component }}:pr-scan'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          skip-setup-trivy: true

      # Sets the tool name shown in the PR checks list ("Trivy" otherwise).
      - name: Name the Trivy tool
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          [ -f "trivy-$COMPONENT.sarif" ] || exit 0
          jq --arg n "2c. Trivy - $COMPONENT image" '.runs[].tool.driver.name = $n' "trivy-$COMPONENT.sarif" > "trivy-$COMPONENT.tmp" && mv "trivy-$COMPONENT.tmp" "trivy-$COMPONENT.sarif"

      # Dependabot PRs get a read-only token, so the upload would fail.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          category: container-scan-${{ matrix.component }}
