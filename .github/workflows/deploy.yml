name: Deploy

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/planner

jobs:
  validate-deploy:
    name: Validate blue/green deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check script and Compose configs
        env:
          CORS_ORIGIN: https://planner.example.com
          IMAGE_TAG: 0123456789abcdef0123456789abcdef01234567
        run: |
          bash -n scripts/blue-green-deploy.sh scripts/blue-green-deploy.test.sh
          bash scripts/blue-green-deploy.test.sh
          docker compose -f compose.prod.yml config --quiet
          for color in blue green; do
            COLOR="$color" docker compose -f compose.prod.color.yml config --quiet
          done

  build:
    name: Build and push ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: .docker/api/Dockerfile
          - component: app
            dockerfile: .docker/app/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          build-args: APK_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  scan:
    name: Scan ${{ matrix.component }} image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, app]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'image'
          scan-ref: '${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          cache-dir: ~/.cache/trivy

      # SARIF only reaches the Security tab; list the blocking findings in the log too.
      - uses: aquasecurity/trivy-action@v0.36.0
        if: failure()
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'image'
          scan-ref: '${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          cache-dir: ~/.cache/trivy
          skip-setup-trivy: true

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          category: container-scan-${{ matrix.component }}

  deploy:
    name: Deploy to VPS
    needs: [scan, validate-deploy]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy inactive color and switch router
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -euo pipefail && \
               cd /p/projects/planner && \
               git pull --ff-only && \
               export CORS_ORIGIN=https://planner.thiagobraga.dev && \
               bash scripts/blue-green-deploy.sh ${{ github.sha }}"

      - name: Verify app and API through public router
        run: |
          for i in $(seq 1 10); do
            app_code=$(curl -s -o /dev/null -w '%{http_code}' https://planner.thiagobraga.dev/ || true)
            api_code=$(curl -s -o /dev/null -w '%{http_code}' https://planner.thiagobraga.dev/api/v1/health || true)
            if [ "$app_code" = "200" ] && [ "$api_code" = "200" ]; then
              echo "Deploy verified (app and API HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: app HTTP $app_code, API HTTP $api_code; retrying in 10s"
            sleep 10
          done
          echo "Service did not return HTTP 200 after deploy"
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
