name: 2a. Quality

on:
  workflow_call:

env:
  NODE_VERSION: '26'
  POSTGRES_USER: planner
  POSTGRES_PASSWORD: planner-test
  REDIS_PASSWORD: planner

jobs:
  api:
    name: 'API: lint, test, build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner-test
          POSTGRES_DB: planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Migrate schema
        run: npx tsx src/db/migrate.ts
        env:
          DATABASE_URL: postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/planner_test
          REDIS_URL: redis://:${{ env.REDIS_PASSWORD }}@localhost:6379
          NODE_ENV: test
      - run: npm run coverage
        env:
          DATABASE_URL: postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/planner_test
          REDIS_URL: redis://:${{ env.REDIS_PASSWORD }}@localhost:6379
          CORS_ORIGIN: http://localhost:5173
          CSRF_SECRET: test-csrf-secret-not-for-production
          NODE_ENV: test
      - run: npm run build
        env:
          NODE_ENV: production

  app:
    name: 'App: lint, test, build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: 'E2E: Playwright'
    needs: [api, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner-test
          POSTGRES_DB: planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CORS_ORIGIN: http://127.0.0.1:4173
      CSRF_SECRET: test-csrf-secret-not-for-production
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:4000/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
        env:
          NODE_ENV: production
      - name: Start API
        working-directory: api
        env:
          PORT: 4000
          DATABASE_URL: postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/planner_test
          REDIS_URL: redis://:${{ env.REDIS_PASSWORD }}@localhost:6379
        run: |
          npx tsx src/db/migrate.ts
          nohup node dist/index.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:4000/api/v1/health; then break; fi
            sleep 1
          done
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build app
        working-directory: app
        run: npm run build
        env:
          # Instrumented build so e2e runs collect coverage (see test:e2e:coverage)
          VITE_COVERAGE: "true"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install Playwright chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: app
        env:
          PLAYWRIGHT_COVERAGE: "1"
        run: npx playwright test
      - name: Generate e2e coverage report
        working-directory: app
        run: node e2e/merge-coverage.ts
      - name: Upload e2e coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-coverage-report
          path: app/coverage-reports/e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: app/e2e/test-results
      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== api.log ==="; tail -50 /tmp/api.log
          echo "App webServer logs are in the Playwright output."
