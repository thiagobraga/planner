name: 3. Release

# Called by ci.yml on push to main, after 2a and 2b passed for that
# commit. A red quality or security run means no release PR and no tag.
on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
    outputs:
      release_created:
        description: 'true when merging the release PR just created a tag'
        value: ${{ jobs.release-please.outputs.release_created }}
      version:
        description: 'SemVer without the v prefix'
        value: ${{ jobs.release-please.outputs.version }}
      tag:
        description: 'Tag of the draft release, e.g. v1.2.3'
        value: ${{ jobs.release-please.outputs.tag }}

permissions: {}

# One release-please run at a time, never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # github.sha is the commit the checks validated, but release-please works on
  # main's tip. If a newer merge landed meanwhile, skip: that merge's own run
  # releases it after validating it.
  ci-gate:
    name: 3a. Validated commit is main tip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VALIDATED: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$VALIDATED" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks passed for $VALIDATED but main moved to $tip. The newer push gets its own run." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-please:
    name: 3b. Release PR and draft tag
    needs: ci-gate
    if: needs.ci-gate.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Optional PAT or app token: it lets CI run on the release PR, since
          # GITHUB_TOKEN events never start workflows. Publishing the release
          # after deploy does not need it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-config.json
          manifest-file: .release-manifest.json

      # GitHub merges the release PR itself once the ruleset's required checks pass. Enabled
      # with the PAT so the merge starts the push run that tags and deploys.
      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is not set: merge the release PR by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PR_NUMBER=$(jq -r '.number // empty' <<<"$PR_JSON")
          if [ -z "$PR_NUMBER" ]; then
            echo "release-please returned no PR number: merge the release PR by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --merge

      - name: Explain outcome
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          PR_OPENED: ${{ steps.release.outputs.prs_created }}
          VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "### Draft release $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag created, release kept as draft. Deploy runs next and publishes it only if the VPS is healthy." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_OPENED" = "true" ]; then
            echo "### Release PR updated" >> "$GITHUB_STEP_SUMMARY"
            echo "Merge the release PR to tag and deploy. Nothing is deployed until then." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
            echo "No feat, fix, perf, refactor or revert commits since the last release. No release PR, no deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
