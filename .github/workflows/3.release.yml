name: 3. Release

on:
  # Runs only after 2. CI finishes on main. A red CI means no release PR,
  # no tag and no deploy. No PR code is checked out here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['2. CI']
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # github.sha is main's tip, not the commit CI validated. If a newer merge
  # landed meanwhile, skip: that merge's own CI run starts its own release run.
  ci-gate:
    name: 3a. CI passed on main tip
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$VALIDATED" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "CI passed for $VALIDATED but main moved to $tip. The newer push gets its own run." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-please:
    name: 3b. Release PR and tag
    needs: ci-gate
    if: needs.ci-gate.outputs.is_tip == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # A PAT or app token lets CI run on the release PR; GITHUB_TOKEN
          # events never start workflows. Set RELEASE_PLEASE_TOKEN to enable.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - name: Explain outcome
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          PR_OPENED: ${{ steps.release.outputs.prs_created }}
          VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "### Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag and GitHub Release created. The Deploy job runs next." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_OPENED" = "true" ]; then
            echo "### Release PR updated" >> "$GITHUB_STEP_SUMMARY"
            echo "Merge the release PR to tag and deploy. Nothing is deployed until then." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
            echo "No feat, fix, perf, refactor or revert commits since the last release. No release PR, no deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Tags made with GITHUB_TOKEN do not trigger other workflows, so the
  # deploy is chained here instead of listening for push: tags.
  deploy:
    name: 3c. Deploy release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/4.deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    # The deploy job reads the SSH_* secrets, so they must be inherited.
    secrets: inherit # zizmor: ignore[secrets-inherit]
