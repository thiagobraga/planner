name: 3. Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: 3a. Release PR and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # A PAT or app token lets CI run on the release PR; GITHUB_TOKEN
          # events never start workflows. Set RELEASE_PLEASE_TOKEN to enable.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - name: Explain outcome
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          PR_OPENED: ${{ steps.release.outputs.prs_created }}
          VERSION: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "### Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag and GitHub Release created. The Deploy job runs next." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_OPENED" = "true" ]; then
            echo "### Release PR updated" >> "$GITHUB_STEP_SUMMARY"
            echo "Merge the release PR to tag and deploy. Nothing is deployed until then." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
            echo "No feat, fix, perf, refactor or revert commits since the last release. No release PR, no deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Re-run the tests on the tagged commit: deploy must not depend on a
  # separate 2. CI run that may have been cancelled or skipped.
  quality:
    name: 3b. Quality
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/2a.quality.yml

  # Tags made with GITHUB_TOKEN do not trigger other workflows, so the
  # deploy is chained here instead of listening for push: tags.
  deploy:
    name: 3c. Deploy release
    needs: [release-please, quality]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/4.deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    # The deploy job reads the SSH_* secrets, so they must be inherited.
    secrets: inherit # zizmor: ignore[secrets-inherit]
