name: Quality

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner-test
          POSTGRES_DB: planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Migrate schema
        run: npx tsx src/db/migrate.ts
        env:
          DATABASE_URL: postgres://planner:planner-test@localhost:5432/planner_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
      - run: npm run coverage
        env:
          DATABASE_URL: postgres://planner:planner-test@localhost:5432/planner_test
          REDIS_URL: redis://localhost:6379
          CORS_ORIGIN: http://localhost:5173
          CSRF_SECRET: test-csrf-secret-not-for-production
          NODE_ENV: test
      - run: npm run build
        env:
          NODE_ENV: production

  app:
    name: App — lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  docker:
    name: Docker — build production images (${{ matrix.component }})
    needs: [api, app]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: .docker/api/Dockerfile
          - component: app
            dockerfile: .docker/app/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: false
          load: false
          tags: planner-${{ matrix.component }}:build-check
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  e2e:
    name: E2E — Playwright
    needs: [api, app]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner-test
          POSTGRES_DB: planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://planner:planner-test@localhost:5432/planner_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://127.0.0.1:5173
      CSRF_SECRET: test-csrf-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
        env:
          NODE_ENV: production
      - name: Start API
        working-directory: api
        env:
          PORT: 4000
        run: |
          npx tsx src/db/migrate.ts
          nohup node dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4000/api/v1/views/today && break || sleep 1; done
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build app
        working-directory: app
        run: npm run build
        env:
          # Instrumented build so e2e runs collect coverage (see test:e2e:coverage)
          VITE_COVERAGE: "true"
      - name: Install Playwright chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: app
        env:
          PLAYWRIGHT_COVERAGE: "1"
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
        run: npx playwright test
      - name: Generate e2e coverage report
        working-directory: app
        run: node e2e/merge-coverage.ts
      - name: Upload e2e coverage report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report
          path: app/dist/html/e2e
      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== api.log ==="; tail -50 /tmp/api.log
          echo "=== app.log ==="; cat /tmp/app.log 2>/dev/null || echo "(no app.log - webServer logs are in the playwright output)"
