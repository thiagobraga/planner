name: Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - '.claude/**'
      - '.claudeignore'
      - '.superpowers/**'
      - '.omx/**'
      - '.vscode/**'
      - '.codegraph/**'
      - 'backups/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - '.claude/**'
      - '.claudeignore'
      - '.superpowers/**'
      - '.omx/**'
      - '.vscode/**'
      - '.codegraph/**'
      - 'backups/**'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write
  packages: write

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  security:
    name: Security
    needs: quality
    uses: ./.github/workflows/security.yml
    secrets: inherit

  container-scan:
    name: Container scan (${{ matrix.component }})
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: .docker/api/Dockerfile
          - component: app
            dockerfile: .docker/app/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: false
          load: true
          tags: planner-${{ matrix.component }}:pr-scan
          # Read-only: reuses the cache quality.yml's docker job warmed for
          # this scope. No cache-to - untrusted PR branches must not write
          # into the cache that deploy.yml's push build later reads from.
          cache-from: type=gha,scope=${{ matrix.component }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: 'planner-${{ matrix.component }}:pr-scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          cache-dir: ~/.cache/trivy

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          category: container-scan-${{ matrix.component }}

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: security
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
