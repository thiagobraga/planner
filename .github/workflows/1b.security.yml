name: 1b. Security (reusable)

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [api, app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: 1b-codeql

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'repo'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          scanners: 'secret'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          cache-dir: ~/.cache/trivy
      # Sets the tool name shown in the PR checks list ("Trivy" otherwise).
      - name: Name the Trivy tool
        if: always()
        run: |
          [ -f trivy-secrets.sarif ] || exit 0
          jq '.runs[].tool.driver.name = "1b. Trivy - secrets"' trivy-secrets.sarif > trivy-secrets.tmp && mv trivy-secrets.tmp trivy-secrets.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-secrets.sarif
          category: secret-scan

  # Container vulnerability scanning lives in 1.ci.yml (PRs) and 3.deploy.yml
  # (release images pushed to GHCR).

  sbom:
    name: SBOM generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'repo'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
          cache-dir: ~/.cache/trivy
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
