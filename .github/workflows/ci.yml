name: CI

# Single entry point. The numbered files are reusable workflows this one calls:
#   PR:           1 review, 2a quality, 2b security, 2c container scan
#   push to main: 2a, 2b, then 3 release (release PR or draft release + tag),
#                 then 4 deploy, which publishes the draft only after the VPS is healthy
#   cron / manual: 2a, 2b
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - '.claude/**'
      - '.claudeignore'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - '.claude/**'
      - '.claudeignore'
      - '.vscode/**'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

# Pushes to main are never cancelled: a quick second merge must not drop
# the first merge's run.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which path-sensitive checks a PR needs. Every other event runs all of them.
  changes:
    name: 0a. Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      code: ${{ steps.filter.outputs.code }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      # The classifier comes from the trusted base, so a PR cannot edit the script that
      # decides whether its own checks run. Missing on the base: nothing is skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci-changes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # skip=true when the change is only a release version bump (release PR, or its merge
      # into main whose parent already has a green CI run). Anything unproven runs everything.
      - id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          skip=false
          if [ -f scripts/ci-changes.sh ]; then
            if [ "$EVENT" = "pull_request" ]; then
              files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '[.[] | {filename, patch}]')
              skip=$(printf '%s' "$files" | bash scripts/ci-changes.sh)
            elif [ "$EVENT" = "push" ] && [ "${BEFORE//0/}" != "" ]; then
              files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '[.files[] | {filename, patch}]')
              green=$(gh run list --repo "$REPO" --workflow ci.yml --event push --commit "$BEFORE" \
                --status success --limit 1 --json databaseId --jq length)
              if [ "$green" = "1" ]; then skip=$(printf '%s' "$files" | bash scripts/ci-changes.sh); fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "### Skip checks: $skip" >> "$GITHUB_STEP_SUMMARY"

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          flag() { if printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          {
            echo "workflows=$(flag '^\.github/|^scripts/ci-changes')"
            echo "code=$(flag '^(api|app|\.docker)/|^package(-lock)?\.json$')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  review:
    name: 1. Review
    if: github.event_name == 'pull_request' && needs.changes.outputs.skip != 'true'
    needs: changes
    uses: ./.github/workflows/1.review.yml
    with:
      workflows_changed: ${{ needs.changes.outputs.workflows == 'true' }}

  quality:
    name: 2a. Quality
    if: needs.changes.outputs.skip != 'true'
    needs: changes
    uses: ./.github/workflows/2a.quality.yml

  security:
    name: 2b. Security
    if: needs.changes.outputs.skip != 'true'
    needs: changes
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/2b.security.yml
    with:
      codeql: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' }}

  container-scan:
    name: 2c. Container scan
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
      && needs.changes.outputs.skip != 'true'
    needs: changes
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/2c.container.yml

  release:
    name: 3. Release
    # Skipped quality/security count as validated only when `changes` proved a release-only bump.
    # A failed `changes` job must block the release, not look like a skip.
    if: >-
      ${{ !cancelled() && github.event_name == 'push'
      && needs.changes.result == 'success'
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.skip == 'true'
          || (needs.quality.result == 'success' && needs.security.result == 'success')) }}
    needs: [changes, quality, security]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/3.release.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # The one check the main ruleset requires. Skipped reusable-workflow jobs report a single
  # "2a. Quality" check instead of their nested ones, so nested names cannot be required.
  # Skipped is fine (proven release-only bump or no relevant change); failed or cancelled is not.
  gate:
    name: CI gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, review, quality, security, container-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "Results: $RESULTS"
          [ "$CHANGES" = "success" ] || { echo "changes did not succeed"; exit 1; }
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  deploy:
    name: 4. Deploy
    # The implicit success() also fails on skipped ancestors (quality, security on a
    # release-only bump), so check the release result explicitly.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.release_created == 'true' }}
    needs: release
    permissions:
      contents: write
      packages: write
      security-events: write
    uses: ./.github/workflows/4.deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    # The deploy job reads the SSH_* secrets, so they must be inherited.
    secrets: inherit # zizmor: ignore[secrets-inherit]
